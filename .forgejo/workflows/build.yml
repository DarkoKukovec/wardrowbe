# Build the backend + frontend images on repos.kuk.is and deploy them (homelab HL-9).
#
# Plain `run:` steps on purpose: Forgejo resolves `uses:` against its own
# actions mirror, and a JS action would need node inside the job container,
# which docker:cli does not have. A docker build needs nothing an action gives.
#
# The Komodo listener call is the LAST step, so a deploy only ever follows a
# successful push to the registry — not the raw git push.
name: build

on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: docker
    container:
      # Has docker + git, no node. Forgejo's own mirror, not Docker Hub:
      # anonymous Hub pulls from this WAN IP are rate-limited estate-wide.
      image: code.forgejo.org/oci/docker:cli
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://token:$TOKEN@192.168.10.11:4363/$GITHUB_REPOSITORY.git" .

      - name: Log in to Docker Hub
        # The Dockerfiles' base images come from Hub. Docker resolves registry
        # auth client-side, in THIS container — the host daemon's /root/.docker
        # is not consulted — so an anonymous build shares the estate-wide
        # 100/hour-per-WAN-IP bucket and fails with 429 under load.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build backend
        run: |
          docker build \
            -t "repos.kuk.is/darko/wardrowbe-backend:$GITHUB_SHA" \
            -t repos.kuk.is/darko/wardrowbe-backend:latest backend

      - name: Build frontend
        # NEXT_PUBLIC_API_URL is baked in at build time and must stay empty —
        # the browser talks to nginx on the same origin (ormar.kuk.is).
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL= \
            -t "repos.kuk.is/darko/wardrowbe-frontend:$GITHUB_SHA" \
            -t repos.kuk.is/darko/wardrowbe-frontend:latest frontend

      - name: Push
        env:
          # User-level Forgejo secret, scope write:package. The automatic
          # GITHUB_TOKEN cannot push packages — blob upload 401s.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login repos.kuk.is -u darko --password-stdin
          for img in wardrowbe-backend wardrowbe-frontend; do
            docker push "repos.kuk.is/darko/$img:$GITHUB_SHA"
            docker push "repos.kuk.is/darko/$img:latest"
          done
          docker logout repos.kuk.is

      - name: Deploy
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        # Komodo core directly on the LAN, not komodo.lab.kuk.is: the public name
        # hairpins through Trpimir's Caddy for a service on this same host.
        # Komodo resolves the resource by name, and the body is the minimal
        # GitHub-shaped payload its branch check reads.
        run: |
          apk add --no-cache curl openssl
          body='{"ref":"refs/heads/main"}'
          sig=$(printf %s "$body" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -fsS -X POST \
            -H 'content-type: application/json' \
            -H "x-hub-signature-256: sha256=$sig" \
            -d "$body" \
            'http://192.168.10.11:9120/listener/github/stack/wardrowbe/deploy'
